name: CI and GHCR delivery

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MLFLOW_ENABLE_TELEMETRY: 'false'
  MLFLOW_DISABLE_AGENT_HINT: '1'
  DVC_NO_ANALYTICS: 'true'

jobs:
  quality:
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test data, DVC, training, MLflow, and CLI
        run: python -m pytest --cov=house_price --cov-report=xml --junitxml=test-results.xml
      - name: Validate notebook
        run: python scripts/check_notebook.py
      - name: Build Python package
        run: python -m build
      - name: Save test reports and package
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-results-${{ matrix.os }}
          path: |
            coverage.xml
            test-results.xml
            dist/
          if-no-files-found: warn

  container:
    name: Build and test Docker image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: house-price:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify CLI and offline model round trip
        run: |
          docker run --rm --network none house-price:ci --help
          docker run --rm --network none --entrypoint python house-price:ci /app/scripts/smoke_test.py

  publish:
    name: Publish tested image to GHCR
    needs: [quality, container]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Use lowercase registry name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build release candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: house-price:release
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
      - name: Test the exact image that will be published
        run: docker run --rm --network none --entrypoint python house-price:release /app/scripts/smoke_test.py
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag house-price:release "$tag"
            docker push "$tag"
            echo "Published: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
