[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price-ml"
version = "0.1.0"
description = "California Housing training with DVC data lineage and MLflow models"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mlflow==3.17.2",
  "scikit-learn==1.9.1",
  "skops==0.16.0",
  "pandas==3.1.0",
  "numpy==2.5.4",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dvc = ["dvc==3.67.1"]
notebook = ["ipykernel>=6,<8", "nbformat>=5.10,<6"]
docs = ["reportlab>=4.4,<5", "pypdf>=6,<7"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "build>=1.2,<2"]

[project.scripts]
house-price = "house_price.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
# Teaching snippets retain the same layout as their notebook cells.
extend-exclude = ["notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["house_price"]
