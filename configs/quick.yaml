# Konfigurasi untuk praktik kelas: 2 kandidat x 2 fold, memakai seluruh dataset.
training:
  test_size: 0.3
  random_state: 42
  cv: 2
  n_jobs: 1
  param_grid:
    n_estimators: [20]
    max_depth: [5, 10]
    min_samples_split: [2]
    min_samples_leaf: [1]
mlflow:
  experiment_name: house-price-classroom
  registered_model_name: Best Random Forest Model
